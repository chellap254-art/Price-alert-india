<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Alert India</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f3f5f9;
      color: #222;
    }

    header {
      background: #075e54;
      color: white;
      padding: 22px 12px;
      text-align: center;
    }

    .search {
      width: 90%;
      max-width: 600px;
      margin: 20px auto;
      display: block;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #ddd;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      color: #087443;
    }

    .low {
      color: #d00000;
      font-weight: bold;
    }

    a, button {
      display: inline-block;
      background: #075e54;
      color: white;
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      margin-top: 8px;
    }

    #status {
      text-align: center;
      padding: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>🛍️ Price Alert India</h1>
  <p>பொருட்களின் விலைகளை ஒப்பிட்டு சேமியுங்கள்!</p>
</header>

<input
  id="search"
  class="search"
  type="search"
  placeholder="பொருட்களைத் தேடுங்கள்..."
>

<p id="status">பொருட்களை ஏற்றுகிறது...</p>

<main id="products"></main>

<script>
  const SUPABASE_URL = "https://wdkyywiwvqsevpcdzkze.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ikyxc6KXCN5Nq6KPLgoStw_XLT8q2Z2";

  const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

  let allProducts = [];

  async function loadProducts() {
    const status = document.getElementById("status");

    const { data, error } = await db
      .from("products")
      .select("*");
    
    console.log("Products:", data);
    
if (error) {
  status.textContent = "பிழை: " + error.message;
  console.error(error);
  return;
}
    allProducts = data || [];
    displayProducts(allProducts);

    status.textContent = allProducts.length
      ? allProducts.length + " பொருட்கள்"
      : "இன்னும் பொருட்கள் சேர்க்கப்படவில்லை.";
  }

  function displayProducts(products) {
    const container = document.getElementById("products");
    container.replaceChildren();

    products.forEach(product => {
      const card = document.createElement("article");
      card.className = "card";

      const name = document.createElement("h3");
      name.textContent = product.name || "பொருள்";

      card.appendChild(name);
      
      const price = document.createElement("p");
      price.className = "price";

      const currentPrice = Number(product.current_price);
      const targetPrice = Number(product.target_price);

      if (product.current_price != null &&
          Number.isFinite(currentPrice)) {
        price.textContent = "தற்போதைய விலை: ₹" + currentPrice;
      } else {
        price.textContent = "விலை விவரம் இல்லை";
      }

      if (product.target_price != null &&
          Number.isFinite(targetPrice)) {
        const target = document.createElement("p");
        target.textContent = "நீங்கள் விரும்பும் விலை: ₹" + targetPrice;
        card.appendChild(target);

        if (Number.isFinite(currentPrice) &&
            currentPrice <= targetPrice) {
          const offer = document.createElement("p");
          offer.className = "low";
          offer.textContent = "🎉 உங்கள் இலக்கு விலையை அடைந்துள்ளது!";
          card.appendChild(offer);
        }
      }

      card.append(name, price);

      if (product.url) {
        try {
          const linkUrl = new URL(product.url);

          if (linkUrl.protocol === "https:" ||
              linkUrl.protocol === "http:") {
            const link = document.createElement("a");
            link.href = linkUrl.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "பொருளைப் பார்க்க";
            card.appendChild(link);
          }
        } catch (e) {
          console.warn("தவறான பொருள் URL", product.url);
        }
      }

      container.appendChild(card);
    });
  }

  document.getElementById("search").addEventListener("input", event => {
    const query = event.target.value.toLowerCase();

    displayProducts(
      allProducts.filter(product =>
        String(product.name || "")
          .toLowerCase()
          .includes(query)
      )
    );
  });

  
    
  if (
    SUPABASE_URL.startsWith("https://") &&
    SUPABASE_KEY
  ) {
    loadProducts();
  } else {
    document.getElementById("status").textContent =
      "Supabase URL அல்லது Key-ஐ சரிபார்க்கவும்.";
  }
</script>
</body>
</html>
