<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Alert India</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f3f5f9;
      color: #222;
    }

    header {
      background: #075e54;
      color: white;
      padding: 22px 12px;
      text-align: center;
    }

    .search {
      width: 90%;
      max-width: 600px;
      margin: 20px auto;
      display: block;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #ddd;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      color: #087443;
    }

    .low {
      color: #d00000;
      font-weight: bold;
    }

    a, button {
      display: inline-block;
      background: #075e54;
      color: white;
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      margin-top: 8px;
    }

    #status {
      text-align: center;
      padding: 12px;
    }
  </style>
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

h1 {
  text-align: center;
  color: #0f766e;
  font-size: 30px;
}

h2 {
  color: #0f766e;
}

#search,
#productForm input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

#productForm {
  max-width: 600px;
  margin: 20px auto;
  padding: 20px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 15px #00000010;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  background: #0f766e;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #115e59;
}

#products {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(230px, 1fr));
  gap: 18px;
  max-width: 1100px;
  margin: 25px auto;
}

.card {
  padding: 20px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 15px #00000010;
  border: 1px solid #e2e8f0;
}

.card h3 {
  color: #0f766e;
  font-size: 20px;
}

.price {
  font-size: 19px;
  font-weight: bold;
}

.card a {
  display: block;
  text-align: center;
  padding: 12px;
  margin-top: 12px;
  background: #2563eb;
  color: white;
  text-decoration: none;
  border-radius: 9px;
}

.card a:hover {
  background: #1d4ed8;
}

.low {
  padding: 12px;
  background: #dcfce7;
  color: #166534;
  border-radius: 8px;
  font-weight: bold;
}

#status {
  text-align: center;
  margin: 15px;
}

@media (max-width: 480px) {
  body {
    padding: 12px;
  }

  h1 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🛍️ Price Alert India</h1>
  <p>பொருட்களின் விலைகளை ஒப்பிட்டு சேமியுங்கள்!</p>
</header>

<input
  id="search"
  class="search"
  type="search"
  placeholder="பொருட்களைத் தேடுங்கள்..."
>
<h2>புதிய பொருளைச் சேர்க்கவும்</h2>

<form id="productForm">
  <input id="productName" placeholder="பொருளின் பெயர்" required>
  <input id="productUrl" type="url" placeholder="பொருள் இணையதள முகவரி" required>
  <input id="currentPrice" type="number" placeholder="தற்போதைய விலை" required>
  <input id="targetPrice" type="number" placeholder="நீங்கள் விரும்பும் விலை" required>
  <button type="submit">பொருளைச் சேர்க்கவும்</button>
</form>
<p id="status">பொருட்களை ஏற்றுகிறது...</p>

<main id="products"></main>

<script>
  const SUPABASE_URL = "https://wdkyywiwvqsevpcdzkze.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ikyxc6KXCN5Nq6KPLgoStw_XLT8q2Z2";

  const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

  let allProducts = [];

  async function loadProducts() {
    const status = document.getElementById("status");

    const { data, error } = await db
      .from("products")
      .select("*");
    
    console.log("Products:", data);
    
if (error) {
  status.textContent = "பிழை: " + error.message;
  console.error(error);
  return;
}
    allProducts = data || [];
    displayProducts(allProducts);

    status.textContent = allProducts.length
      ? allProducts.length + " பொருட்கள்"
      : "இன்னும் பொருட்கள் சேர்க்கப்படவில்லை.";
  }

  function displayProducts(products) {
    const container = document.getElementById("products");
    container.replaceChildren();

    products.forEach(product => {
      const card = document.createElement("article");
      card.className = "card";
if (product.image_url) {
  const image = document.createElement("img");
  image.src = product.image_url;
image.onerror = function() {
  image.alt = "படம் ஏற்ற முடியவில்லை";
  console.log("Image URL:", product.image_url);
};
  image.alt = product.product_name || "பொருள்";
  image.style.width = "100%";
  image.style.height = "180px";
  image.style.objectFit = "contain";
  image.style.marginBottom = "12px";
  image.loading = "lazy";
  card.appendChild(image);
}
      const name = document.createElement("h3");
      name.textContent = product.product_name || "பொருள்"; 
      
      card.appendChild(name);
      
      const price = document.createElement("p");
      price.className = "price";

      const currentPrice = Number(product.current_price);
      const targetPrice = Number(product.target_price);

      if (product.current_price != null &&
          Number.isFinite(currentPrice)) {
        price.textContent = "தற்போதைய விலை: ₹" + currentPrice;
      } else {
        price.textContent = "விலை விவரம் இல்லை";
      }

      if (product.target_price != null &&
          Number.isFinite(targetPrice)) {
        const target = document.createElement("p");
        target.textContent = "நீங்கள் விரும்பும் விலை: ₹" + targetPrice;
        card.appendChild(target);

        if (Number.isFinite(currentPrice) &&
            currentPrice <= targetPrice) {
          const offer = document.createElement("p");
          offer.className = "low";
          offer.textContent = "🎉 உங்கள் இலக்கு விலையை அடைந்துள்ளது!";
          card.appendChild(offer);
        }
      }

      card.append(name, price);

      if (product.product_url) {
        try {
          const linkUrl = new URL(product.product_url);
          
          if (linkUrl.protocol === "https:" ||
              linkUrl.protocol === "http:") {
            const link = document.createElement("a");
            link.href = linkUrl.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "பொருளைப் பார்க்க";
            card.appendChild(link);
          }
        } catch (e) {
          console.warn("தவறான பொருள் URL", product.url);
        }
      }

      container.appendChild(card);
    });
  }

  document.getElementById("search").addEventListener("input", event => {
    const query = event.target.value.toLowerCase();

    displayProducts(
      allProducts.filter(product =>
        String(product.product_name || "")
          .toLowerCase()
          .includes(query)
      )
    );
  });

  document.getElementById("productForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const status = document.getElementById("status");

  const newProduct = {
    product_name: document.getElementById("productName").value.trim(),
    product_url: document.getElementById("productUrl").value.trim(),
    current_price: Number(document.getElementById("currentPrice").value),
    target_price: Number(document.getElementById("targetPrice").value)
  };

  status.textContent = "பொருளைச் சேமிக்கிறது...";

  const { error } = await db
    .from("products")
    .insert([newProduct]);

  if (error) {
    status.textContent = "பிழை: " + error.message;
    console.error(error);
    return;
  }

  document.getElementById("productForm").reset();
  await loadProducts();
  status.textContent = "பொருள் வெற்றிகரமாகச் சேர்க்கப்பட்டது!";
});
    
  if (
    SUPABASE_URL.startsWith("https://") &&
    SUPABASE_KEY
  ) {
    loadProducts();
  } else {
    document.getElementById("status").textContent =
      "Supabase URL அல்லது Key-ஐ சரிபார்க்கவும்.";
  }
</script>
</body>
</html>
